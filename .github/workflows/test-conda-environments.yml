name: Test Conda environments

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-conda-environments.yml'
      - 'env/conda-specfiles/snakemake-env_*'
      - 'env/conda-specfiles/nextflow-env_*'
      - 'env/conda-specfiles/jupyter-env_*'
      - 'env/conda-specfiles/quarto-env_*'
      - 'tutorials/snakemake/snakefile_mrsa.smk'
      - 'tutorials/nextflow/main_mrsa.nf'
      - 'tutorials/nextflow/samplesheet.csv'
      - 'tutorials/jupyter/references.bib'
      - 'tutorials/jupyter/supplementary_material.ipynb'
      - 'tutorials/quarto/quarto-tutorial-example.qmd'

concurrency:
  group: conda-env-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        env: [snakemake, nextflow, jupyter, quarto]
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-latest
            platform: osx-arm64
          - env: snakemake
            cmd: snakemake -c 1 -d tutorials/snakemake/ -s tutorials/snakemake/snakefile_mrsa.smk
          - env: nextflow
            cmd: cd tutorials/nextflow && nextflow run main_mrsa.nf
          - env: jupyter
            cmd: jupyter nbconvert --to HTML tutorials/jupyter/supplementary_material.ipynb
          - env: quarto
            cmd: export QUARTO_DENO=$(which deno) && quarto render tutorials/quarto/quarto-tutorial-example.qmd --to html
        exclude:
          - os: macos-latest
            env: snakemake
          - os: macos-latest
            env: nextflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conda setup
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channel-priority: strict

      - name: Create ${{ matrix.env }} environment
        shell: bash -l {0}
        run: |
          conda create --yes --name ${{ matrix.env }}-env \
            --file env/conda-specfiles/${{ matrix.env }}-env_${{ matrix.platform }}_conda_spec.txt

      - name: Test ${{ matrix.env }} environment
        shell: bash -l {0}
        run: |
          conda activate ${{ matrix.env }}-env
          conda list
          ${{ matrix.cmd }}
